const WORD_BY_EMOJI = Object.fromEntries(PAIRS);

const DEFAULT_WORDS = [
  {emoji:"🐶", word:"dog"},
  {emoji:"🐱", word:"cat"},
  {emoji:"🐟", word:"fish"},
  {emoji:"🐦", word:"bird"},
  {emoji:"🍎", word:"apple"},

  {emoji:"🌙", word:"moon"}
];

const $ = id => document.getElementById(id);
let words = load() || DEFAULT_WORDS.slice();
let i = 0, stars = 0, editing = -1;

let model = null, rec = null;
let ctx = null, srcNode = null, procNode = null, sinkNode = null;
let active = false, timer = null;

function load(){
  try{
    const data = JSON.parse(localStorage.getItem("words"));
    if(!Array.isArray(data) || !data.length) return null;
    return data.map(item => {
      const emoji = String(item.emoji || "");
      const mapped = WORD_BY_EMOJI[emoji];
      const word = mapped || String(item.word || "").trim().toLowerCase();
      return {emoji, word};
    }).filter(w => w.emoji && w.word);
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem("words", JSON.stringify(words)); }catch(e){} }

function word(){ return words[i].word; }
function show(){
  $("picture").textContent = words[i].emoji;
  $("picture").className = "";
  $("word").textContent = word();
  $("note").textContent = "";
}

const EN = "en-US";   // המילה שמתרגלים
const HE = "he-IL";   // המשוב לילד

let voices = [];
function refreshVoices(){
  try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
}
if("speechSynthesis" in window){
  refreshVoices();
  // רשימת הקולות מגיעה מאוחר בחלק מהדפדפנים, ולפעמים יותר מפעם אחת.
  speechSynthesis.addEventListener("voiceschanged", refreshVoices);
}
function voiceFor(lang){
  const pre = lang.slice(0, 2).toLowerCase();
  return voices.find(v => String(v.lang || "").toLowerCase().replace("_", "-").startsWith(pre)) || null;
}

// גבול עליון להמתנה לסיום הקראה. "כל הכבוד!" נמשך כשנייה, אז בדרך כלל
// onend מקדים אותו הרבה והמספר הזה לא בא לידי ביטוי.
const SPEAK_TIMEOUT = 3000;

function speak(text, lang, onDone){
  let called = false;
  const done = ()=>{ if(called) return; called = true; if(onDone) onDone(); };
  if(!("speechSynthesis" in window)){ done(); return; }
  if(!voices.length) refreshVoices();
  const v = voiceFor(lang);
  // אין קול עברי במכשיר? שותקים. הדפדפן היה מקריא עברית בקול אנגלי ויוצא ג'יבריש,
  // והמשוב החזותי — הצבע, ה-🎉 והכוכבים — ממשיך לעבוד גם בלי קול.
  if(lang === HE && !v){ setTimeout(done, 500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = lang === HE ? 0.95 : 0.8;
  if(v) u.voice = v;
  u.onend = done;
  u.onerror = done;
  // onend הוא הבטחה רופפת: ביטול באמצע, מעבר לרקע, או דפדפן שפשוט שותק
  // בלי לדווח — ובלי גבול זמן הילד נשאר תקוע מול ה-🎉 ולא עובר למילה הבאה.
  // done חסין לקריאה כפולה, אז מי שמגיע ראשון קובע.
  setTimeout(done, SPEAK_TIMEOUT);
  speechSynthesis.speak(u);
}

function progress(pct, label){
  $("loading").hidden = false;
  $("fill").style.width = pct + "%";
  $("loadtext").textContent = label;
}

async function fetchModel(){
  if(!("caches" in window) || !("body" in Response.prototype)) return;
  const cache = await caches.open(CACHE);
  if(await cache.match(MODEL_URL)) return;

  const res = await fetch(MODEL_URL);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const total = Number(res.headers.get("Content-Length")) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value);
    got += value.length;
    if(total){
      const pct = Math.round(got / total * 100);
      progress(pct, "מתכוננים… " + pct + "%");
    }else{
      progress(0, "מתכוננים… " + (got / 1048576).toFixed(0) + " MB");
    }
  }
  await cache.put(MODEL_URL, new Response(new Blob(chunks),
    {headers:{"Content-Type":"application/gzip"}}));
}

function controlled(){
  if(!("serviceWorker" in navigator) || navigator.serviceWorker.controller){
    return Promise.resolve();
  }
  return new Promise(done=>{
    navigator.serviceWorker.addEventListener("controllerchange", done, {once:true});
    setTimeout(done, 3000);
  });
}

async function loadModel(){
  try{
    if(typeof Vosk === "undefined") throw new Error("vosk-browser did not load");
    progress(0, "מתכוננים… זה קורה פעם אחת");
    await controlled();
    await fetchModel();
    progress(100, "עוד רגע…");
    model = await Vosk.createModel(MODEL_URL);
    $("loading").hidden = true;
    $("say").disabled = false;
    $("say").querySelector("span").textContent = "🎤";
  }catch(err){
    $("loading").hidden = true;
    $("note").textContent = "לא הצלחנו לטעון את מנוע הדיבור. בדקו את model.tar.gz";
    console.error(err);
  }
}

function grammar(){
  return JSON.stringify(words.map(w=>w.word).concat(["[unk]"]));
}

function buildRecognizer(){
  if(!model || !ctx) return;
  if(rec){ try{ rec.remove(); }catch(e){} rec = null; }
  rec = new model.KaldiRecognizer(ctx.sampleRate, grammar());
  rec.on("result", msg=>{
    if(!active) return;
    const heard = ((msg && msg.result && msg.result.text) || "")
      .split(/\s+/).filter(t => t && t !== "[unk]");
    // רעש רקע, נשימה או "אממ" מזוהים כ-[unk]. זה לא ניסיון, ממשיכים להקשיב עד הטיימר.
    if(!heard.length) return;
    finish(heard.includes(word()));
  });
}

async function ensureAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}
  });
  srcNode = ctx.createMediaStreamSource(stream);
  procNode = ctx.createScriptProcessor(4096, 1, 1);
  procNode.onaudioprocess = e=>{
    // המפענח מקבל אודיו רק בזמן ניסיון. בשאר הזמן המיקרופון פתוח אבל שום דבר לא מעובד.
    if(rec && active){ try{ rec.acceptWaveform(e.inputBuffer); }catch(err){} }
  };
  sinkNode = ctx.createGain();
  sinkNode.gain.value = 0;
  srcNode.connect(procNode);
  procNode.connect(sinkNode);
  sinkNode.connect(ctx.destination);
  buildRecognizer();
}

async function listen(){
  if(active || !model) return;
  try{ await ensureAudio(); }
  catch(err){ $("note").textContent = "צריך לאשר את המיקרופון."; return; }

  $("note").textContent = "";
  active = true;
  $("say").classList.add("listening");
  timer = setTimeout(()=>finish(false), 4000);
}

function finish(ok){
  if(!active) return;
  active = false;
  clearTimeout(timer);
  // מאפס את המפענח כדי שהניסיון הבא יתחיל נקי. התוצאה שחוזרת מכאן נבלעת כי active כבר כבוי.
  if(rec){ try{ rec.retrieveFinalResult(); }catch(err){} }
  $("say").classList.remove("listening");
  ok ? good() : again();
}

function good(){
  stars = Math.min(stars+1, 10);
  $("stars").textContent = "⭐".repeat(stars);
  $("picture").className = "good";
  $("picture").textContent = "🎉";
  speak("כל הכבוד!", HE, ()=>setTimeout(next, 400));
}
function again(){
  $("picture").className = "again";
  speak("נסו שוב", HE, ()=>setTimeout(()=>{ $("picture").className = ""; }, 600));
}
function next(){
  i = (i + 1) % words.length;
  show();
}

function takenSet(){
  return new Set(words.map(w => w.word));
}

function setErr(msg){ $("panelErr").textContent = msg || ""; }

function applyWords(nextWords, nextIndex){
  const before = words.slice();
  words = nextWords;
  if(ctx){
    try{ buildRecognizer(); }
    catch(err){
      words = before;
      buildRecognizer();
      setErr("המודל לא מכיר את המילה הזו.");
      return false;
    }
  }
  save();
  if(typeof nextIndex === "number") i = nextIndex;
  if(i >= words.length) i = 0;
  show();
  renderPanel();
  return true;
}

function addEmoji(emoji){
  const w = WORD_BY_EMOJI[emoji];
  if(!w){ setErr("אין מילה באנגלית לתמונה הזו."); return; }
  if(takenSet().has(w)){ setErr("״" + w + "״ כבר ברשימה."); return; }
  setErr("");
  applyWords(words.concat([{emoji, word:w}]), words.length);
}

function replaceEmoji(index, emoji){
  const w = WORD_BY_EMOJI[emoji];
  if(!w){ setErr("אין מילה באנגלית לתמונה הזו."); return; }
  if(words.some((item, n) => item.word === w && n !== index)){
    setErr("״" + w + "״ כבר ברשימה.");
    return;
  }
  const nextWords = words.slice();
  nextWords[index] = {emoji, word:w};
  editing = -1;
  setErr("");
  applyWords(nextWords, i);
}

function removeAt(index){
  if(words.length <= 1){ setErr("צריך לפחות מילה אחת."); return; }
  const nextWords = words.filter((_, n) => n !== index);
  let nextI = i;
  if(index < i) nextI = i - 1;
  if(nextI >= nextWords.length) nextI = 0;
  if(editing === index) editing = -1;
  setErr("");
  applyWords(nextWords, nextI);
}

function moveAt(index, dir){
  const j = index + dir;
  if(j < 0 || j >= words.length) return;
  const nextWords = words.slice();
  const a = nextWords[index];
  nextWords[index] = nextWords[j];
  nextWords[j] = a;
  let nextI = i;
  if(i === index) nextI = j;
  else if(i === j) nextI = index;
  applyWords(nextWords, nextI);
}

function renderCatalog(){
  const q = $("search").value.trim().toLowerCase();
  const taken = takenSet();
  const box = $("catalog");
  box.innerHTML = "";
  const list = PAIRS.filter(([e,w]) => !q || w.includes(q) || e.includes(q));
  if(!list.length){
    const p = document.createElement("p");
    p.id = "hint";
    p.textContent = "אין תמונה שמתאימה לחיפוש.";
    p.style.gridColumn = "1 / -1";
    p.style.padding = "16px";
    p.style.textAlign = "center";
    box.appendChild(p);
    return;
  }
  list.forEach(([emoji, w]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.title = w;
    if(taken.has(w) && editing < 0) b.className = "taken";
    b.innerHTML = emoji + '<span class="ename">' + w + "</span>";
    b.addEventListener("click", ()=>{
      if(editing >= 0) replaceEmoji(editing, emoji);
      else addEmoji(emoji);
    });
    box.appendChild(b);
  });
}

function renderList(){
  const ul = $("wordList");
  ul.innerHTML = "";
  words.forEach((item, n) => {
    const li = document.createElement("li");
    if(n === i) li.className = "current";
    const jump = document.createElement("button");
    jump.type = "button";
    jump.style.flex = "1";
    jump.style.display = "flex";
    jump.style.alignItems = "center";
    jump.style.gap = "8px";
    jump.style.border = "0";
    jump.style.background = "transparent";
    jump.style.borderRadius = "12px";
    jump.style.padding = "0";
    jump.innerHTML = '<span class="pic">' + item.emoji + '</span><span class="w">' + item.word + "</span>";
    jump.addEventListener("click", ()=>{
      i = n;
      show();
      closePanel();
    });
    const ops = document.createElement("div");
    ops.className = "ops";
    const up = document.createElement("button");
    up.type = "button"; up.textContent = "▲"; up.disabled = n === 0;
    up.addEventListener("click", ()=>moveAt(n, -1));
    const down = document.createElement("button");
    down.type = "button"; down.textContent = "▼"; down.disabled = n === words.length - 1;
    down.addEventListener("click", ()=>moveAt(n, 1));
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "🗑"; del.disabled = words.length <= 1;
    del.addEventListener("click", ()=>removeAt(n));
    ops.append(up, down, del);
    li.append(jump, ops);
    ul.appendChild(li);
  });
}

function renderPanel(){
  $("panelMeta").textContent = words.length + " מילים בתרגול. נשמר במכשיר הזה.";
  $("hint").textContent = editing >= 0
    ? "בחרו תמונה אחרת. המילה באנגלית תתחלף איתה."
    : "לחצו על תמונה כדי להוסיף. המילה באנגלית קבועה.";
  renderCatalog();
  renderList();
}

function openPanel(){
  editing = -1;
  setErr("");
  $("search").value = "";
  $("overlay").hidden = false;
  renderPanel();
}
function closePanel(){
  $("overlay").hidden = true;
  editing = -1;
}

$("picture").addEventListener("click", ()=>speak(word(), EN));
$("hear").addEventListener("click", ()=>speak(word(), EN));
$("say").addEventListener("click", listen);
$("next").addEventListener("click", next);
$("openPanel").addEventListener("click", openPanel);
$("closePanel").addEventListener("click", closePanel);
$("overlay").addEventListener("click", e=>{ if(e.target.id === "overlay") closePanel(); });
$("search").addEventListener("input", renderCatalog);
$("resetBtn").addEventListener("click", ()=>{
  if(!confirm("לחזור ל־16 המילים המקוריות?")) return;
  editing = -1;
  setErr("");
  applyWords(DEFAULT_WORDS.slice(), 0);
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
// מבקש מהדפדפן לא למחוק את המטמון (המודל, 29MB) כשנגמר מקום. בלי חלון אישור;
// אם הדפדפן מסרב, פשוט ממשיכים.
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

show();
loadModel();
</script>
